name: CI

on:
  push:
    branches: [master, develop]
    tags: ["*"]
  pull_request:

# A new push to the same branch or pull request cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # Syntax errors and undefined names only.
      - name: Flake8
        run: uvx flake8 html2image tests --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python on every OS,
        # versions in between on Ubuntu only.
        os: [macos-latest]  # TEMPORARY, PR 218 diagnostics
        python-version: ["3.9", "3.15"]
        case: [cold-1, cold-2, cold-3, full]
    runs-on: ${{ matrix.os }}
    # The same tests can take twice as long from one run to another on
    # macOS, depending on the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # uv installs the requested Python itself, so that the matrix does not
      # depend on the versions shipped with the runner images.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --extra test --extra full-page

      # Recent Ubuntu versions forbid unprivileged user namespaces, which the
      # sandbox of Chromium-based browsers needs to start.
      - name: Allow the browser sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The first start of a browser on a fresh runner takes from 10 seconds to
      # more than a minute, the following ones half a second. Starting each
      # browser once keeps that delay out of the tests.
      - name: Warm up the browsers
        if: runner.os == 'Linux'
        run: |
          chromium --headless=new --dump-dom about:blank > /dev/null
          microsoft-edge --headless=new --dump-dom about:blank > /dev/null
          firefox --headless --screenshot "$RUNNER_TEMP/warmup.png" about:blank

      # pytest lists the 25 slowest tests at the end of the run. The duration
      # of each test will be kept with the run, in test-results.xml.
      - name: Run tests
        # TEMPORARY, PR 218 diagnostics
        run: |
          if [ "${{ matrix.case }}" = full ]; then
            uv run pytest -v --durations=25 --junitxml=test-results.xml
          else
            fail=0
            for i in 1 2 3; do
              uv run pytest --durations=3 -p no:cacheprovider tests/test_own_browser.py -k acts_after || fail=1
            done
            exit $fail
          fi

      - name: Keep the duration of each test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml

  publish:
    name: Build and publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/html2image
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
