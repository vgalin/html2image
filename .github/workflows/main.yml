name: CI

on:
  push:
    branches: [master, develop]
    tags: ["*"]
  pull_request:

# A new push to the same branch or pull request cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # Syntax errors and undefined names only.
      - name: Flake8
        run: uvx flake8 html2image tests --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python on every OS,
        # versions in between on Ubuntu only.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.15"]
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # uv installs the requested Python itself, so that the matrix does not
      # depend on the versions shipped with the runner images.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --extra test

      # Recent Ubuntu versions forbid unprivileged user namespaces, which the
      # sandbox of Chromium-based browsers needs to start.
      - name: Allow the browser sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # TEMPORARY: find out why Chrome and Edge do not start on Ubuntu.
      - name: Debug browsers
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        continue-on-error: true
        run: |
          for name in chromium chromium-browser google-chrome google-chrome-stable microsoft-edge firefox; do
            echo "$name -> $(command -v $name || echo absent)"
          done
          uv run python -c "from html2image.browsers.search_utils import find_chrome; print('find_chrome:', find_chrome())"
          exe=$(uv run python -c "from html2image.browsers.search_utils import find_chrome; print(find_chrome())")
          ls -l "$(command -v "$exe" || echo "$exe")" || true
          "$exe" --version || true
          for extra in "" "--no-sandbox"; do
            echo "=== launch with: '$extra' ==="
            dir=$(mktemp -d)
            timeout 8 "$exe" --window-size=1920,1080 --remote-debugging-port=9222 \
              --user-data-dir="$dir" --headless=new --no-first-run \
              --no-default-browser-check $extra > "$dir/out.log" 2>&1 &
            sleep 5
            curl -s -m 2 http://127.0.0.1:9222/json/version || echo "no CDP answer"
            wait || true
            echo "--- browser output ---"
            head -40 "$dir/out.log"
          done

      - name: Run tests
        run: uv run pytest

  publish:
    name: Build and publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/html2image
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
