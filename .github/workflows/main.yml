name: CI

on:
  push:
    branches: [master, develop]
    tags: ["*"]
  pull_request:

# A new push to the same branch or pull request cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # Syntax errors and undefined names only.
      - name: Flake8
        run: uvx flake8 html2image tests --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Python on every OS,
        # versions in between on Ubuntu only.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.15"]
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # uv installs the requested Python itself, so that the matrix does not
      # depend on the versions shipped with the runner images.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --extra test

      # Recent Ubuntu versions forbid unprivileged user namespaces, which the
      # sandbox of Chromium-based browsers needs to start.
      - name: Allow the browser sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # TEMPORARY: measure how long the first start of each browser takes.
      - name: Debug browser startup
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          for exe in chromium microsoft-edge chromium microsoft-edge; do
            echo "=== $exe ==="
            dir=$(mktemp -d)
            start=$(date +%s.%N)
            "$exe" --window-size=1920,1080 --remote-debugging-port=9222 \
              --user-data-dir="$dir" --headless=new --no-first-run \
              --no-default-browser-check --allow-file-access-from-files \
              '--remote-allow-origins=*' > "$dir/out.log" 2>&1 &
            pid=$!
            answered=no
            for i in $(seq 1 120); do
              if curl -s -m 2 -o /dev/null http://127.0.0.1:9222/json/version; then
                answered=yes; break
              fi
              kill -0 $pid 2>/dev/null || { echo "process exited"; break; }
              sleep 0.5
            done
            echo "answered=$answered after $(echo "$(date +%s.%N) - $start" | bc) s"
            kill $pid 2>/dev/null; wait $pid 2>/dev/null; echo "exit code: $?"
            echo "--- browser output ---"
            head -30 "$dir/out.log"
          done

      - name: Run tests
        run: uv run pytest

  publish:
    name: Build and publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/html2image
    permissions:
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
